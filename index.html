        function buildAnalyticsDatasets() {
            const monthNamesFull = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const monthNamesShort = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

            const fallbackCons = Number(appState.settings.evConsumption) || 16.5;
            const sortedCharges = appState.charges
                .slice()
                .sort((a, b) => a.date.localeCompare(b.date) || ((Number(a.odometer) || 0) - (Number(b.odometer) || 0)));

            // Construir tramos reales entre odómetros o estimados por kWh y consumo ref.
            const segments = [];
            let prevOdo = null;

            sortedCharges.forEach((c) => {
                const kwh = Number(c.kwh) || 0;
                const odo = Number(c.odometer);
                let km = 0;
                let cons = fallbackCons;

                if (Number.isFinite(odo) && odo > 0) {
                    if (prevOdo !== null && odo > prevOdo && (odo - prevOdo) < 4000) {
                        km = odo - prevOdo;
                        if (kwh > 0) {
                            const rawCons = (kwh / km) * 100;
                            if (rawCons >= 6 && rawCons <= 55) {
                                cons = rawCons;
                            }
                        }
                    } else if (kwh > 0) {
                        km = Math.round((kwh / fallbackCons) * 100);
                    }
                    prevOdo = odo;
                } else if (kwh > 0) {
                    km = Math.round((kwh / fallbackCons) * 100);
                }

                segments.push({
                    date: c.date,
                    kwh,
                    km,
                    consumption: Number(cons.toFixed(1))
                });
            });

            // 1. Resumen por mes (últimos 3-4 meses con actividad)
            const monthMap = new Map();
            segments.forEach((seg) => {
                const ym = seg.date.slice(0, 7);
                if (!monthMap.has(ym)) {
                    const [yStr, mStr] = ym.split('-');
                    const mIdx = Math.max(0, Math.min(11, Number(mStr) - 1));
                    monthMap.set(ym, {
                        key: ym,
                        name: monthNamesFull[mIdx],
                        shortName: monthNamesShort[mIdx],
                        year: yStr,
                        km: 0,
                        kwh: 0,
                        consList: []
                    });
                }
                const entry = monthMap.get(ym);
                entry.km += seg.km;
                entry.kwh += seg.kwh;
                if (seg.consumption > 0) entry.consList.push(seg.consumption);
            });

            const monthlyStats = Array.from(monthMap.values())
                .sort((a, b) => a.key.localeCompare(b.key))
                .slice(-4)
                .map((m) => {
                    const avgCons = m.km > 0 && m.kwh > 0
                        ? Number(((m.kwh / m.km) * 100).toFixed(1))
                        : m.consList.length
                            ? Number((m.consList.reduce((acc, v) => acc + v, 0) / m.consList.length).toFixed(1))
                            : fallbackCons;
                    return {
                        key: m.key,
                        name: m.name,
                        shortName: m.shortName,
                        km: Math.round(m.km),
                        avgConsumption: avgCons
                    };
                });

            // 2. Agrupación semanal (lunes a domingo, asignada al mes en que cae el domingo)
            const getMondayDate = (dateStr) => {
                const d = new Date(dateStr + 'T12:00:00');
                const day = d.getDay(); // 0 dom .. 6 sab
                const diffToMonday = day === 0 ? -6 : 1 - day;
                d.setDate(d.getDate() + diffToMonday);
                return d;
            };

            const toIso = (d) => {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };

            const formatShortDay = (d) => `${String(d.getDate()).padStart(2, '0')} ${monthNamesShort[d.getMonth()]}`;

            let weeklyPoints = [];
            if (segments.length > 0) {
                const firstMonday = getMondayDate(segments[0].date);
                const lastMonday = getMondayDate(segments[segments.length - 1].date);

                // Limitar a las últimas 12 semanas para una lectura cómoda en móvil
                const maxStartMonday = new Date(lastMonday.getTime());
                maxStartMonday.setDate(maxStartMonday.getDate() - 11 * 7);
                const startMonday = firstMonday > maxStartMonday ? firstMonday : maxStartMonday;

                const weekBuckets = new Map();
                segments.forEach((seg) => {
                    const monIso = toIso(getMondayDate(seg.date));
                    if (!weekBuckets.has(monIso)) {
                        weekBuckets.set(monIso, { km: 0, kwh: 0, consValues: [] });
                    }
                    const b = weekBuckets.get(monIso);
                    b.km += seg.km;
                    b.kwh += seg.kwh;
                    b.consValues.push(seg.consumption);
                });

                const cursor = new Date(startMonday.getTime());
                let idx = 0;
                while (cursor <= lastMonday && idx < 16) {
                    const monIso = toIso(cursor);
                    const sunday = new Date(cursor.getTime());
                    sunday.setDate(sunday.getDate() + 6);

                    const endMonthKey = `${sunday.getFullYear()}-${String(sunday.getMonth() + 1).padStart(2, '0')}`;
                    const endMonthName = monthNamesFull[sunday.getMonth()];
                    const bucket = weekBuckets.get(monIso);

                    let val = null;
                    if (bucket) {
                        if (bucket.km > 0 && bucket.kwh > 0) {
                            val = Number(((bucket.kwh / bucket.km) * 100).toFixed(1));
                        } else if (bucket.consValues.length) {
                            val = Number((bucket.consValues.reduce((a, b) => a + b, 0) / bucket.consValues.length).toFixed(1));
                        }
                    }

                    weeklyPoints.push({
                        id: `wk_${monIso}`,
                        label: formatShortDay(sunday),
                        range: `Lun ${formatShortDay(cursor)} – Dom ${formatShortDay(sunday)}`,
                        monthKey: endMonthKey,
                        monthName: endMonthName,
                        value: val
                    });

                    cursor.setDate(cursor.getDate() + 7);
                    idx++;
                }
            }

            // 3. Agrupación cada 2 semanas
            const biweeklyPoints = [];
            for (let i = 0; i < weeklyPoints.length; i += 2) {
                const w1 = weeklyPoints[i];
                const w2 = weeklyPoints[i + 1] || w1;
                const vals = [w1.value, w2 !== w1 ? w2.value : null].filter((v) => v !== null);
                const avgVal = vals.length
                    ? Number((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1))
                    : null;

                biweeklyPoints.push({
                    id: `bw_${w1.id}`,
                    label: w2.label,
                    range: `${w1.range.split(' – ')[0]} – ${w2.range.split(' – ')[1]}`,
                    monthKey: w2.monthKey,
                    monthName: w2.monthName,
                    value: avgVal
                });
            }

            return {
                monthlyStats,
                weeklyPoints,
                biweeklyPoints
            };
        }

        function renderWeeklyAndMonthlyCharts() {
            const weeklySvg = document.getElementById('weekly-consumption-svg');
            const cardsEl = document.getElementById('monthly-summary-cards');
            const kmMonthSvg = document.getElementById('km-by-month-svg');
            if (!weeklySvg || !cardsEl || !kmMonthSvg) return;

            const { monthlyStats, weeklyPoints, biweeklyPoints } = buildAnalyticsDatasets();
            const dataset = appState.consumptionChartMode === 'week' ? weeklyPoints : biweeklyPoints;

            // Renderizar recuadros laterales por mes (fijos, no cambian entre Semana / 2 semanas)
            if (!monthlyStats.length) {
                cardsEl.innerHTML = `<div class="col-span-2 sm:col-span-1 rounded-xl bg-slate-950/80 border border-slate-800 p-3 text-center text-[11px] text-slate-400">Registra cargas para ver el resumen por mes.</div>`;
            } else {
                cardsEl.innerHTML = monthlyStats.slice(-3).reverse().map((m) => `
                    <div class="rounded-xl bg-slate-950/90 border border-slate-800 p-2.5 flex flex-col justify-between gap-1.5">
                        <div class="text-xs font-bold text-white">${m.name}</div>
                        <div class="grid grid-cols-2 gap-1.5">
                            <div class="rounded-lg bg-slate-900/90 px-2 py-1.5 border border-slate-800/80">
                                <div class="text-[9px] text-slate-400">Media</div>
                                <div class="text-xs font-mono font-bold text-amber-300">${formatCommaNum(m.avgConsumption)}</div>
                            </div>
                            <div class="rounded-lg bg-slate-900/90 px-2 py-1.5 border border-slate-800/80">
                                <div class="text-[9px] text-slate-400">Km</div>
                                <div class="text-xs font-mono font-bold text-sky-300">${m.km.toLocaleString('es-ES')}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Renderizar Gráfico 1: Consumo por semana / 2 semanas
            weeklySvg.innerHTML = '';
            if (!dataset.length) {
                const emptyTxt = createSvgNode('text', {
                    x: 270,
                    y: 142,
                    'text-anchor': 'middle',
                    fill: '#64748b',
                    'font-size': 12
                });
                emptyTxt.textContent = 'Sin cargas suficientes para mostrar semanas';
                weeklySvg.appendChild(emptyTxt);
            } else {
                const width = 540;
                const height = 285;
                const padLeft = 40;
                const padRight = 28;
                const padTop = 28;
                const padBottom = 46;
                const plotW = width - padLeft - padRight;
                const plotH = height - padTop - padBottom;

                const validVals = dataset.map((d) => d.value).filter((v) => v !== null);
                const monthAvgs = monthlyStats.map((m) => m.avgConsumption);
                const allVals = [...validVals, ...monthAvgs, 15, 21];
                const minY = Math.max(8, Math.floor(Math.min(...allVals) - 1.5));
                const maxY = Math.ceil(Math.max(...allVals) + 1.5);

                const yForVal = (v) => padTop + plotH - ((v - minY) / Math.max(1, maxY - minY)) * plotH;
                const stepX = dataset.length > 1 ? plotW / (dataset.length - 1) : plotW / 2;
                const xForIdx = (i) => dataset.length > 1 ? padLeft + stepX * i : padLeft + plotW / 2;

                // Rejilla Y
                const tickCount = 4;
                for (let t = 0; t <= tickCount; t++) {
                    const val = minY + ((maxY - minY) / tickCount) * t;
                    const y = yForVal(val);
                    weeklySvg.appendChild(createSvgNode('line', {
                        x1: padLeft,
                        y1: y,
                        x2: width - padRight,
                        y2: y,
                        stroke: '#1e293b',
                        'stroke-width': 1
                    }));

                    const lbl = createSvgNode('text', {
                        x: padLeft - 7,
                        y: y + 3.5,
                        'text-anchor': 'end',
                        fill: '#94a3b8',
                        'font-size': 10
                    });
                    lbl.textContent = formatCommaNum(val, 0);
                    weeklySvg.appendChild(lbl);

                const monthGroups = [];
                dataset.forEach((item, idx) => {
                    const lastGrp = monthGroups[monthGroups.length - 1];
                    if (!lastGrp || lastGrp.monthKey !== item.monthKey) {
                        monthGroups.push({
                            monthKey: item.monthKey,
                            monthName: item.monthName,
                            startIdx: idx,
                            endIdx: idx

                    } else {

                        fill: '#94a3b8',
                        'font-size': 10,
                        'font-weight': 700

                    mHdr.textContent = grp.monthName;

                        weeklySvg.appendChild(createSvgNode('line', {
                            x1: startX + 3,
                            y1: avgY,
                            x2: endX - 3,
                            y2: avgY,
                            stroke: '#fbbf24',
                            'stroke-width': 1.8,
                            'stroke-dasharray': '5 4'

                    }

                // Línea continua uniendo puntos válidos (saltando huecos «sin datos»)
                const validPts = [];
                dataset.forEach((item, idx) => {

                    const d = validPts
                        .map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)
                        .join(' ');
                    weeklySvg.appendChild(createSvgNode('path', {
                        d,
                        fill: 'none',
                        stroke: '#34d399',
                        'stroke-width': 2.5,
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round'
                    }));
                }

                // Determinar índice del último punto válido para mostrar su valor fijo
                let lastValidIdx = -1;
                for (let i = dataset.length - 1; i >= 0; i--) {
                    if (dataset[i].value !== null) {
                        lastValidIdx = i;
                        break;
                    }
                }

                dataset.forEach((item, idx) => {
                    const cx = xForIdx(idx);
                    const isSelected = appState.selectedConsumptionPointId === item.id;
                    const isLastValid = idx === lastValidIdx;

                    // Etiqueta del eje X (mostrar todas si <= 7 puntos, o alternas si hay muchas semanas)
                    if (dataset.length <= 7 || idx % 2 === 0 || idx === dataset.length - 1) {
                        const xLbl = createSvgNode('text', {
                            x: cx,
                            y: padTop + plotH + 18,
                            'text-anchor': 'middle',
                            fill: isSelected ? '#ffffff' : '#94a3b8',
                            'font-size': 9.5,
                            'font-weight': isSelected ? 700 : 400
                        });
                        xLbl.textContent = item.label;
                        weeklySvg.appendChild(xLbl);

                        hitGroup.appendChild(createSvgNode('line', {
                            x1: cx,
                            y1: padTop + 8,
                            x2: cx,
                            y2: padTop + plotH,
                            stroke: '#fb7185',
                            'stroke-width': 1,
                            'stroke-dasharray': '2 3',
                            opacity: 0.55
                        }));
                        hitGroup.appendChild(createSvgNode('circle', {
                            cx,
                            cy: nullY,
                            r: isSelected ? 6 : 4.5,
                            fill: '#1e1b2e',
                            stroke: '#fb7185',
                            'stroke-width': 2,
                            class: 'chart-point-circle'
                        }));
                        const noDataLbl = createSvgNode('text', {
                            x: cx,
                            y: nullY - 9,
                            'text-anchor': 'middle',
                            fill: '#fda4af',
                            'font-size': 9,
                            'font-weight': 600

                        noDataLbl.textContent = 'sin datos';
                        hitGroup.appendChild(noDataLbl);
                        hitGroup.appendChild(createSvgNode('circle', { cx, cy: nullY, r: 18, fill: 'transparent' }));
                    } else {
                        const cy = yForVal(item.value);
                        hitGroup.appendChild(createSvgNode('circle', {
                            cx,
                            cy,
                            r: isSelected ? 6.5 : isLastValid ? 5.5 : 4.3,
                            fill: isSelected ? '#ffffff' : '#10b981',
                            stroke: isSelected ? '#10b981' : '#022c22',
                            'stroke-width': 2.2,
                            class: 'chart-point-circle'
                        }));

                        if (isLastValid) {
                            const bw = 38;
                            const bh = 18;
                            const bx = Math.min(width - padRight - bw + 6, Math.max(padLeft, cx - bw / 2));
                            const by = Math.max(padTop - 2, cy - 26);

                            hitGroup.appendChild(createSvgNode('rect', {
                                x: bx,
                                y: by,
                                width: bw,
                                height: bh,
                                rx: 5,
                                fill: '#10b981'
                            }));
                            const valText = createSvgNode('text', {
                                x: bx + bw / 2,
                                y: by + 12.5,
                                'text-anchor': 'middle',
                                fill: '#022c22',
                                'font-size': 10.5,
                                'font-weight': 800
                            });
                            valText.textContent = formatCommaNum(item.value);
                            hitGroup.appendChild(valText);
                        }

                        hitGroup.appendChild(createSvgNode('circle', { cx, cy, r: 18, fill: 'transparent' }));
                    }

                    hitGroup.addEventListener('click', () => showConsumptionPointDetail(item));
                    weeklySvg.appendChild(hitGroup);

            }

            // Renderizar Gráfico 2: Km recorridos por mes + línea de consumo medio

            if (!monthlyStats.length) {

                emptyTxt.textContent = 'Sin datos mensuales aún';

            } else {

                const padRight = 44;

                const plotW = width - padLeft - padRight;
                const plotH = height - padTop - padBottom;

                const maxKmRaw = Math.max(...monthlyStats.map((m) => m.km), 200);
                const maxKm = Math.ceil(maxKmRaw / 200) * 200;

                const consVals = monthlyStats.map((m) => m.avgConsumption);
                const minCons = Math.max(8, Math.floor(Math.min(...consVals, 14) - 1.5));
                const maxCons = Math.ceil(Math.max(...consVals, 20) + 1.5);

                const yForKm = (km) => padTop + plotH - (km / Math.max(1, maxKm)) * plotH;
                const yForCons = (c) => padTop + plotH - ((c - minCons) / Math.max(1, maxCons - minCons)) * plotH;

                // Eje izquierdo (Km)
                for (let i = 0; i <= 3; i++) {
                    const val = Math.round((maxKm / 3) * i);
                    const y = yForKm(val);
                    kmMonthSvg.appendChild(createSvgNode('line', {
                        x1: padLeft,
                        y1: y,
                        x2: width - padRight,
                        y2: y,
                        stroke: '#1e293b',
                        'stroke-width': 1
                    }));
                    const lbl = createSvgNode('text', {
                        x: padLeft - 7,
                        y: y + 3.5,
                        'text-anchor': 'end',
                        fill: '#7dd3fc',
                        'font-size': 10
                    });
                    lbl.textContent = val.toLocaleString('es-ES');
                    kmMonthSvg.appendChild(lbl);
                }

                // Eje derecho (Consumo medio)
                for (let i = 0; i <= 3; i++) {
                    const val = minCons + ((maxCons - minCons) / 3) * i;
                    const y = yForCons(val);
                    const lbl = createSvgNode('text', {
                        x: width - padRight + 7,
                        y: y + 3.5,
                        'text-anchor': 'start',
                        fill: '#fcd34d',
                        'font-size': 10
                    });
                    lbl.textContent = formatCommaNum(val);
                    kmMonthSvg.appendChild(lbl);
                }

                const colW = plotW / monthlyStats.length;
                const barW = Math.min(58, colW * 0.44);
                const linePts = [];

                monthlyStats.forEach((m, idx) => {
                    const cx = padLeft + colW * idx + colW / 2;
                    const topY = yForKm(m.km);
                    const barH = Math.max(4, padTop + plotH - topY);

                    // Barra suave de km
                    kmMonthSvg.appendChild(createSvgNode('rect', {
                        x: cx - barW / 2,
                        y: topY,
                        width: barW,
                        height: barH,
                        rx: 8,
                        fill: 'rgba(56, 189, 248, 0.22)',
                        stroke: 'rgba(125, 211, 252, 0.55)',
                        'stroke-width': 1.4
                    }));

                    // Nombre del mes
                    const nameLbl = createSvgNode('text', {
                        x: cx,

                        'font-size': 11,
                        'font-weight': 600

                    kmMonthSvg.appendChild(nameLbl);

                    const kmLbl = createSvgNode('text', {

                if (linePts.length > 1) {
                    const d = linePts
                        .map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)
                        .join(' ');
                    kmMonthSvg.appendChild(createSvgNode('path', {
                        d,
                        fill: 'none',
                        stroke: '#fbbf24',
                        'stroke-width': 2.5,
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round'
                    }));
                }

                // Puntos y valor escrito en cada punto
                linePts.forEach((p) => {
                    kmMonthSvg.appendChild(createSvgNode('circle', {
                        cx: p.x,
                        cy: p.y,
                        r: 5,
                        fill: '#fbbf24',
                        stroke: '#090d16',
                        'stroke-width': 2
                    }));

                    const valY = Math.max(p.y - 10, padTop + 9);
                    const valLbl = createSvgNode('text', {
                        x: p.x,
                        y: valY,
                        'text-anchor': 'middle',
                        fill: '#fde68a',
                        'font-size': 11,
                        'font-weight': 700
                    });
                    valLbl.textContent = formatCommaNum(p.val);
                    kmMonthSvg.appendChild(valLbl);
                });
            }
